{% extends "base.html" %}

{% block title %}500 — Server Error — CourseConnect{% endblock %}

{% block content %}
<div class="container" style="padding: 6rem 1.5rem; text-align: center;">
  <div style="font-family: 'Plus Jakarta Sans'; font-size: 5rem; font-weight: 800; color: #DC2626; line-height: 1;">500</div>
  <h1 style="font-size: 2rem; color: var(--navy-800); margin: 1rem 0;">Internal System Error</h1>
  <p style="color: var(--text-muted); max-width: 500px; margin: 0 auto 2rem; font-size: 1.1rem;">
    {{ message|default:"An unexpected server error occurred. Our engineering team has logged the issue." }}
  </p>
  <a href="{% url 'courses:index' %}" class="btn-gold btn-gold-lg">
    Back to Homepage
  </a>
</div>
{% endblock %}
