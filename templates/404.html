{% extends "base.html" %}

{% block title %}404 — Page Not Found — CourseConnect{% endblock %}

{% block content %}
<div class="container" style="padding: 6rem 1.5rem; text-align: center;">
  <div style="font-family: 'Plus Jakarta Sans'; font-size: 5rem; font-weight: 800; color: var(--gold-600); line-height: 1;">404</div>
  <h1 style="font-size: 2rem; color: var(--navy-800); margin: 1rem 0;">Page Not Found</h1>
  <p style="color: var(--text-muted); max-width: 500px; margin: 0 auto 2rem; font-size: 1.1rem;">
    {{ message or "The requested resource could not be found or has been relocated." }}
  </p>
  <a href="{{ url_for('course.index') }}" class="btn-gold btn-gold-lg">
    Back to Homepage
  </a>
</div>
{% endblock %}
